<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Premium Contact Form</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap");

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Main Container */
        .container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            background-color: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            display: flex;
            overflow: hidden;
            margin: 20px;
        }

        /* Left Side: Contact Info */
        .contact-info {
            flex: 1;
            background: linear-gradient(135deg, #1abc9c, #149279);
            padding: 40px;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .info-header h3 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .info-header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .details {
            margin: 40px 0;
        }

        .detail-item {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            font-size: 1rem;
        }

        .detail-item i {
            margin-right: 15px;
            font-size: 1.2rem;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: 50%;
        }

        .social-links a {
            color: #fff;
            font-size: 1.3rem;
            margin-right: 20px;
            transition: 0.3s;
        }

        .social-links a:hover {
            color: #2c3e50;
        }

        /* Right Side: Form */
        .contact-form {
            flex: 1.5;
            padding: 40px;
            position: relative;
        }

        .contact-form h3 {
            color: #1abc9c;
            font-size: 1.8rem;
            margin-bottom: 30px;
        }

        .input-container {
            position: relative;
            margin-bottom: 25px;
        }

        .input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #eee;
            border-radius: 10px;
            outline: none;
            font-size: 1rem;
            transition: 0.3s;
            background: #f9f9f9;
        }

        .input:focus {
            border-color: #1abc9c;
            background: #fff;
        }

        .input-container label {
            position: absolute;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
            color: #aaa;
            pointer-events: none;
            transition: 0.3s;
        }

        /* Floating Label Logic */
        .input-container.focus label,
        .input-container.not-empty label {
            top: -10px;
            left: 10px;
            font-size: 0.8rem;
            background: #fff;
            padding: 0 5px;
            color: #1abc9c;
            transform: translateY(0);
        }

        textarea.input {
            min-height: 120px;
            resize: none;
        }

        .btn {
            background: #1abc9c;
            color: #fff;
            border: none;
            padding: 12px 35px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }

        .btn:hover {
            background: #149279;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(26, 188, 156, 0.3);
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .contact-info {
                padding: 30px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="contact-info">
            <div class="info-header">
                <h3>Contact Info</h3>
                <p>Feel free to reach out to us. We will get back to you within 24 hours.</p>
            </div>

            <div class="details">
                <div class="detail-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <span>123 Street, Mumbai, India</span>
                </div>
                <div class="detail-item">
                    <i class="fas fa-envelope"></i>
                    <span>support@example.com</span>
                </div>
                <div class="detail-item">
                    <i class="fas fa-phone"></i>
                    <span>+91 98765 43210</span>
                </div>
            </div>

            <div class="social-links">
                <a href="#"><i class="fab fa-facebook-f"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-linkedin-in"></i></a>
            </div>
        </div>

        <div class="contact-form">
            <form action="#" autocomplete="off" id="contactForm">
                <h3>Send a Message</h3>
                
                <div class="input-container">
                    <input type="text" name="name" class="input" id="name" required />
                    <label>Username</label>
                </div>

                <div class="input-container">
                    <input type="email" name="email" class="input" id="email" required />
                    <label>Email Address</label>
                </div>

                <div class="input-container">
                    <input type="tel" name="phone" class="input" id="phone" />
                    <label>Phone Number</label>
                </div>

                <div class="input-container">
                    <textarea name="message" class="input" id="message" required></textarea>
                    <label>How can we help you?</label>
                </div>

                <button type="submit" class="btn">Send Message</button>
            </form>
        </div>
    </div>

    <script>
        const inputs = document.querySelectorAll(".input");

        function focusFunc() {
            let parent = this.parentNode;
            parent.classList.add("focus");
        }

        function blurFunc() {
            let parent = this.parentNode;
            if (this.value == "") {
                parent.classList.remove("focus");
                parent.classList.remove("not-empty");
            } else {
                parent.classList.add("not-empty");
            }
        }

        inputs.forEach((input) => {
            input.addEventListener("focus", focusFunc);
            input.addEventListener("blur", blurFunc);
        });
    </script>
</body>
</html>
