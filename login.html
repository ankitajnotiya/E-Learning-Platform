<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login | E-Learning Platform</title>
    <link href="bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        .back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background-color: #f8f9fa;
            color: #333;
            border-radius: 50%;
            text-decoration: none;
            border: 1px solid #ddd;
            cursor: pointer;
            position: absolute;
            left: 15px;
            top: 0;
        }
        .back-btn:hover {
            background-color: #00c3ff;
            color: #fff;
            border-color: #00c3ff;
        }
        .header-container {
            position: relative;
            text-align: center;
            margin-bottom: 50px;
            padding-top: 10px;
        }
        .login-container {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #00c3ff;
            box-shadow: 0 0 0 0.2rem rgba(0,195,255,0.25);
        }
        .btn-login {
            background: linear-gradient(135deg, #00c3ff, #0099cc);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 30px;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,195,255,0.3);
            color: white;
        }
        .social-login {
            border-top: 1px solid #e0e0e0;
            margin-top: 30px;
            padding-top: 20px;
        }
        .social-btn {
            border-radius: 50px;
            padding: 10px 20px;
            margin: 0 5px;
            border: 2px solid #e0e0e0;
            background: white;
            transition: all 0.3s ease;
        }
        .social-btn:hover {
            transform: translateY(-2px);
        }
        .social-btn.google:hover {
            background: #ea4335;
            color: white;
            border-color: #ea4335;
        }
        .social-btn.facebook:hover {
            background: #1877f2;
            color: white;
            border-color: #1877f2;
        }
        .social-btn.github:hover {
            background: #333;
            color: white;
            border-color: #333;
        }
        .course-info {
            background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: center;
        }
        .course-info img {
            height: 60px;
            margin-bottom: 15px;
        }
        .price-tag {
            font-size: 28px;
            font-weight: bold;
            color: #007bff;
        }
    </style>
</head>
<body>
    <div class="container-xxl py-5">
        <div class="container">
            <div class="header-container">
                <a onclick="history.back()" class="back-btn shadow-sm">
                    <i class="fa fa-arrow-left"></i>
                </a>
                <h1>Login to Continue</h1>
            </div>

            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <div class="course-info">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a7/React-icon.svg" alt="React">
                        <h4>React JS Mastery Course</h4>
                        <div class="price-tag">₹ 1,399</div>
                        <p class="text-muted">60 Hours • Intermediate • 4.8 Rating</p>
                    </div>

                    <div class="login-container">
                        <h3 class="text-center mb-4">Welcome Back!</h3>
                        <p class="text-center text-muted mb-4">Login to access your course</p>
                        
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0">
                                        <i class="fa fa-envelope text-muted"></i>
                                    </span>
                                    <input type="email" class="form-control border-start-0" id="email" placeholder="Enter your email" required>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0">
                                        <i class="fa fa-lock text-muted"></i>
                                    </span>
                                    <input type="password" class="form-control border-start-0" id="password" placeholder="Enter your password" required>
                                </div>
                            </div>
                            
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="remember">
                                <label class="form-check-label" for="remember">
                                    Remember me
                                </label>
                            </div>
                            
                            <button type="submit" class="btn btn-login mb-3">
                                <i class="fa fa-sign-in me-2"></i>Login to Course
                            </button>
                            
                            <div class="text-center mb-3">
                                <a href="#" class="text-decoration-none">Forgot Password?</a>
                            </div>
                        </form>

                        <div class="social-login">
                            <p class="text-center text-muted mb-3">Or continue with</p>
                            <div class="d-flex justify-content-center">
                                <button class="btn social-btn google">
                                    <i class="fa fa-google"></i>
                                </button>
                                <button class="btn social-btn facebook">
                                    <i class="fa fa-facebook"></i>
                                </button>
                                <button class="btn social-btn github">
                                    <i class="fa fa-github"></i>
                                </button>
                            </div>
                        </div>

                        <div class="text-center mt-4">
                            <p class="text-muted">Don't have an account? <a href="#" class="text-decoration-none">Sign up</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Simple validation (in real app, this would be server-side)
            if (email && password) {
                // Store login info in localStorage
                localStorage.setItem('userEmail', email);
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('enrolledCourse', 'react-course');
                
                // Redirect to study page
                window.location.href = 'study.html';
            }
        });

        // Check if user is already logged in
        window.addEventListener('load', function() {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            if (isLoggedIn === 'true') {
                // User is already logged in, redirect to study page
                window.location.href = 'study.html';
            }
        });

        // Social login handlers
        document.querySelectorAll('.social-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                // Simulate social login
                localStorage.setItem('userEmail', 'user@example.com');
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('enrolledCourse', 'react-course');
                window.location.href = 'study.html';
            });
        });
    </script>
</body>
</html>
