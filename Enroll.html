<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Enroll Form</title>
<style>
    /* Gradient Background */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    /* Form Container */
    form {
        background-color: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 400px;
        transition: transform 0.3s ease;
    }

    form:hover {
        transform: translateY(-5px);
    }

    .form-header {
        text-align: center;
        margin-bottom: 25px;
    }

    .form-header h2 {
        color: #333;
        margin: 0;
        font-size: 28px;
        letter-spacing: 1px;
    }

    .form-header p {
        color: #777;
        font-size: 14px;
        margin-top: 5px;
    }

    /* Input Styling */
    input {
        width: 100%;
        padding: 12px 15px;
        margin: 10px 0;
        border: 2px solid #eee;
        border-radius: 8px;
        box-sizing: border-box;
        font-size: 14px;
        transition: border-color 0.3s ease;
        outline: none;
    }

    input:focus {
        border-color: #764ba2;
    }

    /* Button Styling */
    button {
        width: 100%;
        background: linear-gradient(to right, #667eea, #764ba2);
        color: white;
        padding: 12px;
        margin-top: 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        text-transform: uppercase;
        transition: opacity 0.3s ease, letter-spacing 0.3s ease;
    }

    button:hover {
        opacity: 0.9;
        letter-spacing: 1px;
    }

    /* Simple Animation */
    @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.9); }
        to { opacity: 1; transform: scale(1); }
    }

    form {
        animation: fadeIn 0.5s ease-out;
    }
</style>
</head>
<body>
    
<form id="registration">
    <div class="form-header">
        <h2>Enroll Now</h2>
        <p>Please fill details to get started</p>
    </div>

    <input type="text" id="username" placeholder="Username" required>
    <input type="email" id="email" placeholder="Email Address" required>
    <input type="password" id="password" placeholder="Password" required>
    <input type="text" id="contact" placeholder="Contact Number" required>
    <input type="text" id="message" placeholder="Your Message" required>

    <button type="submit">Submit Registration</button>
</form>

<script>
    // Fix: ID yahan "registration" honi chahiye jo form tag mein hai
    document.getElementById('registration').addEventListener('submit', function(event) {
        event.preventDefault();
        
        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const contact = document.getElementById('contact').value.trim();
        const message = document.getElementById('message').value.trim();

        if (!username || !email || !password || !contact || !message) {
            alert('Please fill in all fields');
            return;
        }

        alert('Registration Successful, ' + username + '!');
    });
</script>
</body>
</html>
